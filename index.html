<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="VoiCal - 语音日历工具，通过中文语音快速管理日程" />
  <title>VoiCal - 语音日历工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="app-header">
      <div class="header-left">
        <h1 class="logo">
          <span class="logo-icon">📅</span>
          <span class="logo-text">VoiCal</span>
        </h1>
        <span class="logo-subtitle">语音日历工具</span>
        <button id="btn-theme-toggle" class="btn-theme-toggle" title="切换深色/浅色模式">🌙</button>
      </div>
      <div class="header-center">
        <button id="btn-prev" class="btn btn-icon-only" title="上一页">❮</button>
        <button id="btn-today" class="btn btn-ghost">今天</button>
        <button id="btn-next" class="btn btn-icon-only" title="下一页">❯</button>
        <span id="calendar-title" class="calendar-title"></span>
      </div>
      <div class="header-right">
        <div class="view-switcher">
          <button class="btn btn-view active" data-view="dayGridMonth">月</button>
          <button class="btn btn-view" data-view="timeGridWeek">周</button>
          <button class="btn btn-view" data-view="timeGridDay">日</button>
        </div>
        <button id="btn-export" class="btn btn-outline btn-sm" title="导出 .ics 日历文件">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          导出
        </button>
        <button id="btn-add-manual" class="btn btn-primary">
          <span class="btn-icon">+</span> 添加事件
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main id="main-content">
      <!-- Calendar Area -->
      <section id="calendar-section">
        <div id="calendar"></div>

        <!-- Status Bar -->
        <div id="status-bar" class="status-bar">
          <div id="status-feedback" class="status-section status-feedback">
            <span class="status-icon">💬</span>
            <span id="status-feedback-text">就绪 — 点击麦克风或按空格键开始语音</span>
          </div>
          <div class="status-section status-stats">
            <span id="status-today-count" class="stat-badge">0</span>
            <span class="stat-label">今日事件</span>
            <span class="status-divider">│</span>
            <span id="status-week-count" class="stat-badge">0</span>
            <span class="stat-label">本周事件</span>
          </div>
          <div class="status-section status-shortcuts">
            <kbd>Space</kbd> 语音
            <kbd>N</kbd> 新建
            <kbd>M</kbd><kbd>W</kbd><kbd>D</kbd> 视图
            <kbd>K</kbd> 主题
          </div>
        </div>
      </section>

      <!-- Voice & Events Sidebar -->
      <aside id="sidebar">
        <!-- Voice Panel -->
        <div id="voice-panel" class="sidebar-card">
          <h2 class="card-title">语音助手</h2>
          <p id="voice-hint" class="voice-hint">点击麦克风，说出你的指令</p>

          <!-- Voice Transcript Display -->
          <div id="voice-transcript" class="voice-transcript hidden">
            <span id="transcript-text"></span>
            <span id="transcript-cursor" class="cursor-blink">|</span>
          </div>

          <!-- Voice Feedback -->
          <div id="voice-feedback" class="voice-feedback hidden">
            <div class="feedback-icon">✓</div>
            <p id="feedback-text"></p>
          </div>

          <!-- Mic Button -->
          <div class="mic-container">
            <canvas id="mic-visualizer" class="mic-visualizer" width="200" height="200"></canvas>
            <div id="mic-ripple-1" class="mic-ripple"></div>
            <div id="mic-ripple-2" class="mic-ripple"></div>
            <div id="mic-ripple-3" class="mic-ripple"></div>
            <button id="btn-mic" class="btn-mic" title="点击开始语音输入">
              <svg id="mic-icon" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
              <svg id="mic-stop-icon" class="hidden" viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                <rect x="6" y="6" width="12" height="12" rx="2"></rect>
              </svg>
              <svg id="mic-loading-icon" class="hidden" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
              </svg>
            </button>
          </div>

          <!-- Example Commands -->
          <div class="voice-examples">
            <p class="examples-title">试试说：</p>
            <div class="example-chips">
              <span class="chip">"添加明天下午三点开会"</span>
              <span class="chip">"每周五下午一点组会"</span>
              <span class="chip">"查看本周日程"</span>
              <span class="chip">"删除组会"</span>
            </div>
          </div>
        </div>

        <!-- Upcoming Events -->
        <div id="events-panel" class="sidebar-card">
          <h2 class="card-title">即将到来</h2>
          <div id="events-list" class="events-list">
            <p class="empty-state">暂无日程安排</p>
          </div>
        </div>

        <!-- Wallpaper Settings -->
        <div id="wallpaper-panel" class="sidebar-card">
          <h2 class="card-title">🖼️ 背景设置</h2>
          <div class="wallpaper-controls">
            <label class="wallpaper-upload-btn" for="wallpaper-input">
              <span>📁 上传壁纸</span>
              <input type="file" id="wallpaper-input" accept="image/*" hidden />
            </label>
            <button id="btn-wallpaper-reset" class="btn btn-ghost btn-sm">恢复默认</button>
          </div>
          <div class="wallpaper-presets">
            <button class="wallpaper-preset" data-preset="gradient-warm" title="暖色渐变"></button>
            <button class="wallpaper-preset" data-preset="gradient-cool" title="冷色渐变"></button>
            <button class="wallpaper-preset" data-preset="gradient-sunset" title="落日渐变"></button>
            <button class="wallpaper-preset" data-preset="gradient-night" title="夜空渐变"></button>
          </div>
        </div>
      </aside>
    </main>

    <!-- Manual Add Event Modal -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div id="modal-add-event" class="modal">
        <div class="modal-header">
          <h2>添加事件</h2>
          <button id="btn-modal-close" class="btn-close">&times;</button>
        </div>
        <form id="form-add-event" class="modal-form">
          <div class="form-group">
            <label for="input-title">事件标题</label>
            <input type="text" id="input-title" placeholder="例如：团队会议" required />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="input-date">日期</label>
              <input type="date" id="input-date" required />
            </div>
            <div class="form-group">
              <label for="input-time">时间</label>
              <input type="time" id="input-time" required />
            </div>
          </div>
          <div class="form-group">
            <label for="input-duration">时长（分钟）</label>
            <input type="number" id="input-duration" value="60" min="15" step="15" />
          </div>
          <div class="form-group">
            <label for="input-reminder">提前提醒</label>
            <select id="input-reminder">
              <option value="0">不提醒</option>
              <option value="5">5 分钟前</option>
              <option value="15" selected>15 分钟前</option>
              <option value="30">30 分钟前</option>
              <option value="60">1 小时前</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="button" id="btn-cancel" class="btn btn-ghost">取消</button>
            <button type="submit" class="btn btn-primary">确认添加</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Browser Compatibility Warning -->
    <div id="compat-warning" class="compat-warning hidden">
      <p>⚠️ 当前浏览器不支持语音识别，请使用 Chrome 或 Edge 浏览器。手动输入功能仍可正常使用。</p>
      <button id="btn-dismiss-warning" class="btn btn-ghost btn-sm">知道了</button>
    </div>
  </div>

  <script>
    var Module = {
      locateFile: function(path, scriptDirectory) {
        return '/js/' + path;
      },
      onRuntimeInitialized: function() {
        console.log("Sherpa-ONNX WASM loaded.");
        window.__SherpaWasmReady = true;
        
        // 恢复 UI 状态
        const micBtn = document.getElementById('btn-mic');
        if (micBtn && micBtn.classList.contains('loading')) {
          micBtn.classList.remove('loading');
          
          const loadIcon = document.getElementById('mic-loading-icon');
          const micIcon = document.getElementById('mic-icon');
          const hint = document.getElementById('voice-hint');
          
          if (loadIcon) loadIcon.classList.add('hidden');
          if (micIcon) micIcon.classList.remove('hidden');
          if (hint) hint.textContent = '模型就绪！点击麦克风，说出你的指令';
        }
      },
      setStatus: function(text) {
        const hint = document.getElementById('voice-hint');
        const micBtn = document.getElementById('btn-mic');
        if (!hint || !micBtn || !micBtn.classList.contains('loading')) return;
        
        if (text.includes('Downloading data...')) {
          const match = text.match(/\((\d+)\/(\d+)\)/);
          if (match) {
            const loaded = (parseInt(match[1]) / (1024 * 1024)).toFixed(1);
            const total = (parseInt(match[2]) / (1024 * 1024)).toFixed(1);
            hint.textContent = `首次加载模型数据... ${loaded}MB / ${total}MB`;
          }
        } else if (text) {
          hint.textContent = text;
        }
      }
    };
  </script>
  <script src="/js/sherpa-onnx-asr.js"></script>
  <script src="/js/sherpa-onnx-wasm-main-asr.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
